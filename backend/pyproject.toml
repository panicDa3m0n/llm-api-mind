[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-mind-backend"
version = "1.3.0"
description = "FastAPI backend for the LLM API Mind experimental runtime."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49,<1.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlmodel>=0.0.16,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
