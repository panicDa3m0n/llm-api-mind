[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-mind-backend"
version = "1.62.0"
description = "FastAPI backend for the LLM API Mind experimental runtime."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49,<1.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "networkx>=3.2,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlmodel>=0.0.16,<1.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]
retrieval = [
    "pymilvus[milvus-lite]>=2.5,<4.0",
]

[project.scripts]
scarlet-agentic-module = "scarlet_agentic_module_sdk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = [
    "app/agentic_modules/contracts.py",
    "app/agentic_modules/host.py",
    "app/agentic_modules/ports.py",
    "app/agentic_modules/process_wrapper.py",
    "app/agentic_modules/registry.py",
    "app/agentic_modules/telemetry.py",
    "app/agentic_modules/transport.py",
    "app/agentic_modules/validation.py",
    "app/api/chat_accounting.py",
    "app/api/chat_native_turn.py",
    "app/api/chat_provider_history.py",
    "app/api/chat_serialization.py",
    "app/api/chat_stream_v2.py",
    "app/api/device_exploration.py",
    "app/api/autonomy.py",
    "app/config.py",
    "app/mind/agent_modes.py",
    "app/mind/command_registry.py",
    "app/mind/context_families.py",
    "app/mind/context_preserved.py",
    "app/mind/context_projection.py",
    "app/mind/context_retrieval.py",
    "app/mind/episode.py",
    "app/mind/memory_lifecycle.py",
    "app/mind/memory_proposals.py",
    "app/mind/memory_read.py",
    "app/mind/memory_relations.py",
    "app/mind/memory_shared.py",
    "app/mind/memory_write.py",
    "app/mind/relevance_rerank.py",
    "app/mind/wake_registry.py",
    "app/mind/workspace_contracts.py",
    "app/runtime/autonomy.py",
    "app/runtime/cognitive_workspace.py",
    "app/runtime/context_accounting.py",
    "app/runtime/answer_obligations.py",
    "app/runtime/history_compaction.py",
    "app/runtime/maintenance_history.py",
    "app/runtime/maintenance_memory.py",
    "app/runtime/maintenance_scheduler.py",
    "app/runtime/maintenance_shared.py",
    "app/storage/database_boundary.py",
    "app/storage/repository/cognitive_workspace.py",
    "app/storage/repository/device_exploration.py",
    "scarlet_agentic_module_sdk/cli.py",
    "scarlet_agentic_module_sdk/client.py",
    "scarlet_agentic_module_sdk/conformance.py",
    "scarlet_agentic_module_sdk/contracts.py",
    "scarlet_agentic_module_sdk/runtime.py",
    "scarlet_agentic_module_sdk/scaffold.py",
    "scarlet_agentic_module_sdk/schema.py",
    "scarlet_agentic_module_sdk/validation.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
source = ["app", "scarlet_agentic_module_sdk"]

[tool.coverage.report]
fail_under = 79.9
show_missing = true

[tool.setuptools.packages.find]
include = ["app*", "scarlet_agentic_module_sdk*"]

[tool.setuptools.package-data]
scarlet_agentic_module_sdk = ["py.typed"]
